[project]
name = "snowkumo"
version = "0.1.0"
description = "A reproducible NVIDIA Kumo experiment in Snowflake with Helsinki weather"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12",
  "ty",
  "nbformat>=5.10",
  "ipython>=8",
  "matplotlib>=3.10",
  "pandas>=2.2,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["examples/helsinki"]
testpaths = ["examples/helsinki"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ty.src]
exclude = ["**/*.ipynb"]
